name: CI

# ⚠️ Found a bug? Please open an issue at
#    https://github.com/KernelKraze/The-Onion-Router/issues

on:
  push:
    branches: ['ci/**', 'refactor/**']
  pull_request:
    branches: ['ci/**', 'refactor/**']
  workflow_dispatch:

env:
  MAKEFLAGS: -j4

jobs:
  build-test:
    name: ${{ matrix.os }} / ${{ matrix.cc }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            cc: gcc
          - os: ubuntu-24.04
            cc: clang
          # Same two Linux builds on aarch64. The steps below branch on
          # runner.os, not on this string, so they need no arm64 case.
          - os: ubuntu-22.04-arm
            cc: gcc
          - os: ubuntu-24.04-arm
            cc: clang
          - os: macos-14
            cc: clang
          - os: macos-15
            cc: clang
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q build-essential automake autoconf \
            libtool pkg-config libevent-dev libssl-dev zlib1g-dev \
            liblzma-dev libzstd-dev python3

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install automake autoconf libtool libevent openssl@3 xz zstd pkg-config

      - name: Configure
        run: |
          ./autogen.sh
          if [ "${{ runner.os }}" = "macOS" ]; then
            CC=${{ matrix.cc }} ./configure --enable-fatal-warnings --disable-asciidoc \
              --with-openssl-dir="$(brew --prefix openssl@3)" \
              --with-libevent-dir="$(brew --prefix libevent)"
          else
            CC=${{ matrix.cc }} ./configure --enable-fatal-warnings --disable-asciidoc
          fi

      - name: Build
        run: make

      - name: Unit tests
        run: make check

      - name: Workqueue alert-mechanism variants
        # exit 77 is the automake skip code (eventfd/pipe2 on macOS)
        run: |
          ./src/test/test_workqueue
          ./src/test/test_workqueue -T 16
          for v in pipe socketpair pipe2 efd efd2; do
            rc=0
            sh "src/test/test_workqueue_${v}.sh" || rc=$?
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 77 ]; then
              echo "variant $v failed rc=$rc"
              exit 1
            fi
          done

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.os }}-${{ matrix.cc }}
          path: |
            test-suite.log
            config.log
          retention-days: 7

      - name: Prepare production binary
        run: |
          plat="${{ matrix.os }}-${{ matrix.cc }}"
          bin="src/app/tor-production-${plat}"
          cp src/app/tor "$bin"
          if [ "${{ runner.os }}" = "Linux" ]; then
            # Split rather than discard. Stripping used to throw the symbols
            # away, which left nothing able to profile or backtrace the
            # binary we actually publish: the hardened build is a separate
            # compilation and carries a different GNU build-id, which is the
            # value gdb and perf pair a binary with its symbols by, so it
            # cannot stand in. Extract first, strip second, and record the
            # link, so the two halves stay matched.
            objcopy --only-keep-debug "$bin" "$bin.debug"
            strip "$bin"
            objcopy --add-gnu-debuglink="$bin.debug" "$bin"
          else
            strip "$bin" 2>/dev/null || :
          fi

      - name: Check the debuginfo matches the binary
        if: runner.os == 'Linux'
        run: |
          plat="${{ matrix.os }}-${{ matrix.cc }}"
          bin="src/app/tor-production-${plat}"
          id_bin=$(readelf -n "$bin" | awk '/Build ID/{print $3}')
          id_dbg=$(readelf -n "$bin.debug" | awk '/Build ID/{print $3}')
          echo "binary    $id_bin"
          echo "debuginfo $id_dbg"
          # Unequal ids mean the pair would be rejected by every tool that
          # checks them, which is the failure this whole step exists to
          # avoid; an empty id means something dropped the note section.
          if [ -z "$id_bin" ] || [ "$id_bin" != "$id_dbg" ]; then
            echo "::error::build ids do not match, the debuginfo is unusable"
            exit 1
          fi
          if ! readelf -S "$bin.debug" | grep -q '\.debug_info'; then
            echo "::error::$bin.debug carries no DWARF"
            exit 1
          fi
          if file "$bin" | grep -q 'not stripped'; then
            echo "::error::$bin was not stripped"
            exit 1
          fi

      - name: Build hardened (debug) binary
        run: |
          make clean
          ./autogen.sh
          if [ "${{ runner.os }}" = "macOS" ]; then
            CC=${{ matrix.cc }} ./configure --enable-fatal-warnings \
              --enable-fragile-hardening --disable-asciidoc \
              --with-openssl-dir="$(brew --prefix openssl@3)" \
              --with-libevent-dir="$(brew --prefix libevent)"
          else
            CC=${{ matrix.cc }} ./configure --enable-fatal-warnings \
              --enable-fragile-hardening --disable-asciidoc
          fi
          make -j4 src/app/tor
          plat="${{ matrix.os }}-${{ matrix.cc }}"
          cp src/app/tor "src/app/tor-debug-${plat}"

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: tor-${{ matrix.os }}-${{ matrix.cc }}-production
          path: src/app/tor-production-${{ matrix.os }}-${{ matrix.cc }}
          retention-days: 30

      - name: Upload debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: tor-${{ matrix.os }}-${{ matrix.cc }}-debug
          path: src/app/tor-debug-${{ matrix.os }}-${{ matrix.cc }}
          retention-days: 30

      # Linux only: this is an ELF .debug file, and the macOS equivalent
      # would be a .dSYM bundle produced by a different tool.
      - name: Upload debuginfo artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: tor-${{ matrix.os }}-${{ matrix.cc }}-debuginfo
          path: src/app/tor-production-${{ matrix.os }}-${{ matrix.cc }}.debug
          retention-days: 30

  tsan-workqueue:
    name: TSan workqueue (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q build-essential automake autoconf \
            libtool pkg-config libevent-dev libssl-dev zlib1g-dev \
            liblzma-dev libzstd-dev clang

      - name: Configure with ThreadSanitizer
        run: |
          ./autogen.sh
          CC=clang \
          CFLAGS="-fsanitize=thread -O1 -g -fno-omit-frame-pointer" \
          LDFLAGS="-fsanitize=thread" \
          ./configure --disable-asciidoc --disable-gcc-hardening

      - name: Build workqueue test
        run: |
          make micro-revision.i
          make src/test/test_workqueue

      - name: Run under TSan
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: |
          # "cancel" (test_workqueue -C) is in TESTSCRIPTS, so "make check"
          # already runs it on every build platform -- but never under a
          # sanitizer, and cancelling work tears down the same queue state
          # that #41148 raced on. This is the only place it gets instrumented.
          ./src/test/test_workqueue
          ./src/test/test_workqueue -T 16
          for v in cancel pipe socketpair pipe2 efd efd2; do
            rc=0
            sh "src/test/test_workqueue_${v}.sh" || rc=$?
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 77 ]; then
              echo "variant $v failed rc=$rc"
              exit 1
            fi
          done

      - name: Reproducer under TSan
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: |
          # The build already knows how to make this, with whatever CFLAGS
          # configure was given -- here that is the thread sanitizer.
          make src/test/test_workqueue_shutdown
          TOR_TEST_WORKQUEUE_ROUNDS=50 sh src/test/test_workqueue_shutdown.sh

  asan-workqueue:
    name: ASan/UBSan workqueue (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q build-essential automake autoconf \
            libtool pkg-config libevent-dev libssl-dev zlib1g-dev \
            liblzma-dev libzstd-dev clang

      - name: Configure with fragile hardening
        run: |
          ./autogen.sh
          CC=clang ./configure --enable-fragile-hardening --disable-asciidoc

      - name: Build
        run: make

      - name: Unit tests under ASan
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: ./src/test/test

      # The build matrix runs this through "make check", but those builds
      # carry no sanitizer, so an overflow of a few bytes stays inside the
      # heap and passes silently. This is the only job where the cell
      # parsers are actually instrumented.
      - name: Cell parser boundary cases under ASan
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ./src/test/test_fuzz_cell.sh

      - name: Workqueue and reproducer under ASan with leak check
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: |
          ./src/test/test_workqueue
          ./src/test/test_workqueue -T 16
          make src/test/test_workqueue_shutdown
          TOR_TEST_WORKQUEUE_ROUNDS=50 sh src/test/test_workqueue_shutdown.sh

  coverage:
    name: Coverage of our own changes
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      pct: ${{ steps.report.outputs.pct }}
      total: ${{ steps.report.outputs.total }}
      hit: ${{ steps.report.outputs.hit }}
      excluded: ${{ steps.report.outputs.excluded }}
      nodata: ${{ steps.report.outputs.nodata }}
      strict: ${{ steps.report.outputs.strict }}
      strict_total: ${{ steps.report.outputs.strict_total }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Need upstream/main to work out which lines are ours.
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q build-essential automake autoconf \
            libtool pkg-config libevent-dev libssl-dev zlib1g-dev \
            liblzma-dev libzstd-dev

      - name: Build instrumented
        run: |
          ./autogen.sh
          ./configure --enable-coverage --disable-asciidoc
          # git_revision.c includes micro-revision.i, and the rule that
          # declares that dependency names an object automake never emits.
          make micro-revision.i
          make -j"$(nproc)"

      - name: Run the tests
        run: |
          # Not "make check": that reruns configure-time checks and is
          # slower than driving the binaries, and a failing test here should
          # not hide the coverage numbers -- the other jobs already gate on
          # the results.
          ./src/test/test || true
          ./src/test/test_workqueue || true
          for v in cancel efd efd2 pipe pipe2 socketpair; do
            sh "src/test/test_workqueue_${v}.sh" || true
          done
          make src/test/test_workqueue_shutdown
          sh src/test/test_workqueue_shutdown.sh || true

      - name: Report
        id: report
        run: |
          # The question this job answers is not "how much of tor is
          # covered" -- that number is dominated by code we never touched.
          # It is "of the lines this branch adds, how many does anything
          # execute". Lines gcov marks with '-' are declarations, comments
          # and braces; they are not counted either way. Lines the source
          # marks LCOV_EXCL are set aside as well, but the count of them is
          # reported: setting lines aside raises the ratio, so how many were
          # set aside has to stay visible next to it.
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          mkdir -p covout
          ./scripts/test/coverage covout > /dev/null 2>&1 || true
          python3 - <<'EOF'
          import subprocess, os, re

          base = "origin/main"

          def added_lines(path):
              """Line numbers this branch adds to <path>, taken from the diff."""
              d = subprocess.run(['git','diff','-U0',base,'HEAD','--',path],
                                 capture_output=True,text=True).stdout
              out=set(); cur=None
              for l in d.splitlines():
                  m=re.match(r'^@@ -\S+ \+(\d+)', l)
                  if m: cur=int(m.group(1)); continue
                  if cur is None: continue
                  if l.startswith('+') and not l.startswith('+++'):
                      out.add(cur); cur+=1
                  elif l.startswith('-') and not l.startswith('---'):
                      pass
                  else:
                      cur+=1
              return out

          def excluded(path):
              """Lines the source itself marks as not to be covered.

              gcov knows nothing about LCOV_EXCL; only lcov and genhtml read those
              markers. Counting raw .gcov without them charges us for code the
              project has declared unreachable, such as assert-unreached branches.
              """
              ex=set(); start=None
              try:
                  with open(path, errors='replace') as fh:
                      for n,l in enumerate(fh,1):
                          if 'LCOV_EXCL_LINE' in l: ex.add(n)
                          elif 'LCOV_EXCL_START' in l: start=n
                          elif 'LCOV_EXCL_STOP' in l and start is not None:
                              ex.update(range(start,n+1)); start=None
              except OSError:
                  pass
              return ex

          def looks_executable(text):
              """Whether a line is the sort gcov would attach a count to."""
              t=text.strip()
              if not t: return False
              if t.startswith(('//','/*','*','#')): return False
              return t not in ('{','}','};',')',');','else','do')

          files = subprocess.run(['git','diff','--name-only',base,'HEAD','--',
              'src/lib/','src/core/','src/feature/','src/app/'],
              capture_output=True,text=True).stdout.split()
          files = [f for f in files if f.endswith('.c')]

          print(f"{'file':<44}{'exec':>6}{'hit':>6}{'miss':>6}{'excl':>6}{'':>3}")
          print("-"*74)
          tc=tu=nx=nd=0; misses=[]; nodata=[]
          for f in files:
              added=added_lines(f)
              if not added: continue
              ex=excluded(f)
              gf=os.path.join('covout', os.path.basename(f)+'.gcov')
              if not os.path.exists(gf):
                  # No .gcov: this build never compiled the file, so nothing in it
                  # ran. Dropping it would quietly raise the percentage.
                  try:
                      src=open(f, errors='replace').read().splitlines()
                  except OSError:
                      src=[]
                  n=sum(1 for ln in sorted(added)
                        if ln not in ex and ln<=len(src) and looks_executable(src[ln-1]))
                  nd+=n; nodata.append((f,n))
                  print(f"{f:<44}{'':>6}{'':>6}{'':>6}{'':>6}   {n} line(s), no coverage data")
                  continue
              hit=miss=exc=0; ml=[]
              for gl in open(gf, errors='replace'):
                  mm=re.match(r'\s*([#\-0-9]+)\s*:\s*(\d+):', gl)
                  if not mm: continue
                  cnt,ln = mm.group(1), int(mm.group(2))
                  if ln not in added or cnt=='-': continue
                  # Counted separately rather than dropped: setting lines aside
                  # raises the ratio, so the amount set aside has to stay visible.
                  if ln in ex: exc+=1; continue
                  if cnt.startswith('#'): miss+=1; ml.append(ln)
                  else: hit+=1
              tc+=hit; tu+=miss; nx+=exc
              print(f"{f:<44}{hit+miss:>6}{hit:>6}{miss:>6}{exc:>6}")
              if ml: misses.append((f,ml))
          print("-"*74)
          total=tc+tu
          pct = tc/total*100 if total else 100.0
          print(f"{'total':<44}{total:>6}{tc:>6}{tu:>6}{nx:>6}   {pct:.1f}%")

          # Two figures, not one. The first is over the lines this build can
          # measure; the second additionally charges us for the LCOV_EXCL regions
          # and for files it never compiled. Publishing only the first would be
          # reporting the more flattering of two numbers we already know.
          strict_total = total + nx + nd
          strict = tc/strict_total*100 if strict_total else 100.0
          print(f"{'strict (counts excluded and unbuilt)':<44}"
                f"{strict_total:>6}{tc:>6}{strict_total-tc:>6}{'':>6}   {strict:.1f}%")

          gh = os.environ.get('GITHUB_OUTPUT')
          if gh:
              with open(gh,'a') as fh:
                  fh.write(f"pct={pct:.1f}\n")
                  fh.write(f"total={total}\n")
                  fh.write(f"hit={tc}\n")
                  fh.write(f"excluded={nx}\n")
                  fh.write(f"nodata={nd}\n")
                  fh.write(f"strict={strict:.1f}\n")
                  fh.write(f"strict_total={strict_total}\n")
          for f,ml in misses:
              print(f"\n  {f} not executed: {ml}")
          for f,n in nodata:
              print(f"\n  {f}: {n} line(s) with no coverage data, counted as missed")
          EOF

      - name: Upload gcov output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-gcov
          path: covout/
          retention-days: 7

  valgrind-fds:
    name: Valgrind file descriptors
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q build-essential automake autoconf \
            libtool pkg-config libevent-dev libssl-dev zlib1g-dev \
            liblzma-dev libzstd-dev valgrind
          valgrind --version

      - name: Build
        run: |
          ./autogen.sh
          # No sanitizer here: ASan and valgrind each want to own the
          # allocator and cannot be combined. -g so the leak report names
          # the line that opened the descriptor.
          ./configure --disable-asciidoc CFLAGS="-O1 -g"
          # git_revision.c includes micro-revision.i, but the rule that
          # declares that dependency names an object file that automake does
          # not actually produce, so nothing orders the two. A full "make"
          # gets away with it; asking for one target does not.
          make micro-revision.i
          make -j"$(nproc)" src/test/test_workqueue

      - name: Build the reproducer
        run: |
          make src/test/test_workqueue_shutdown

      - name: Descriptors and leaks under memcheck
        run: |
          # A reply queue opens a socket pair that nothing used to close.
          # ASan and LeakSanitizer cannot see this: they intercept the malloc
          # family, while descriptors are kernel objects. valgrind tracks the
          # syscalls that create and destroy them, so it can.
          #
          # Uninitialised-value checking stays on. HelpfulTools.md suggests
          # --undef-value-errors=no for OpenSSL noise, but that line is from
          # 2009 and says "non-Debian openssls": it dates from when OpenSSL
          # read uninitialised memory as an entropy source. Upstream rewrote
          # the RAND code long ago, and no sanitizer we run checks for
          # uninitialised reads at all, so this is the only place we would
          # catch one.
          #
          # Two rounds separate a leak from a constant: a pool that loses
          # descriptors loses them every time it is destroyed. valgrind costs
          # a couple of orders of magnitude in speed, hence REPRO_ITERS.
          status=0
          run_one() {
            name="$1"; shift
            echo "== $name"
            valgrind --track-fds=yes --leak-check=full \
                     --errors-for-leak-kinds=definite \
                     --error-exitcode=99 \
                     "$@" > "vg-$name.log" 2>&1
            rc=$?
            [ "$rc" -eq 0 ] || { echo "::error::memcheck exited $rc on $name"; status=1; }
            # Before valgrind 3.24 a leaked descriptor is reported but does
            # not count as an error, so --error-exitcode alone would let one
            # through. Read the report instead.
            #
            # Counting is not enough either. valgrind's total covers the three
            # std streams, whatever the runner handed down (two here, listed
            # as "inherited from parent"), and libevent's epoll and signal
            # pipes, which test_workqueue leaves open because it never tears
            # its event base down. None of those are ours. What is ours comes
            # from socketpair or eventfd inside alert_sockets_create, so look
            # for a descriptor whose backtrace names that.
            if ! grep -q 'FILE DESCRIPTORS:' "vg-$name.log"; then
              echo "::error::$name: no descriptor report; did --track-fds work?"
              status=1
            fi
            echo "   $(grep -m1 'FILE DESCRIPTORS:' "vg-$name.log" | \
                       sed 's/^==[0-9]*== //')"
            ours=$(grep -A6 'Open file descriptor' "vg-$name.log" | \
                   grep -c 'alert_sockets_create\|replyqueue_new' || true)
            if [ "${ours:-0}" -gt 0 ]; then
              echo "::error::$name: $ours descriptor(s) from the reply queue \
          still open at exit"
              grep -B2 -A8 'alert_sockets_create\|replyqueue_new' \
                "vg-$name.log" | head -60
              status=1
            fi
            tail -12 "vg-$name.log"
          }
          # valgrind runs this a hundred times slower, so ask for fewer
          # rounds and turn the binary's own deadline off; the memcheck run
          # is bounded by the job timeout instead.
          export TOR_TEST_WORKQUEUE_ROUNDS=20 TOR_TEST_WORKQUEUE_DEADLINE=0
          B=./src/test/test_workqueue_shutdown
          run_one busy   "$B"
          run_one idle   "$B" idle
          run_one update "$B" update
          run_one unittest ./src/test/test_workqueue
          exit $status

      - name: pthread API misuse under helgrind
        continue-on-error: true
        run: |
          # helgrind checks things no sanitizer does: unlocking a mutex the
          # thread does not hold, destroying one that is still locked, and
          # waiting on a condition variable with the wrong mutex. #41148 was
          # exactly this family -- workers reaching for a mutex the main
          # thread had already freed.
          #
          # It is not gating yet. helgrind has no model of C11 atomics, which
          # this tree uses for the log severity, so a clean baseline has to
          # hold for a while before a failure here can mean anything.
          #
          # The first run took one second for one round, so the round count
          # was costing coverage and buying nothing. All three teardown
          # shapes, twenty rounds each.
          status=0
          for mode in "" idle update; do
            echo "== ${mode:-busy}"
            TOR_TEST_WORKQUEUE_ROUNDS=20 TOR_TEST_WORKQUEUE_DEADLINE=0 \
              valgrind --tool=helgrind \
              ./src/test/test_workqueue_shutdown $mode \
              > "vg-helgrind-${mode:-busy}.log" 2>&1 || status=1
            grep -E 'ERROR SUMMARY' "vg-helgrind-${mode:-busy}.log" || true
            grep -E 'lock order|not locked|Thread #[0-9]+ (unlocked|was created)' \
              "vg-helgrind-${mode:-busy}.log" | head -20 || true
          done
          [ "$status" -eq 0 ] || echo "::warning::helgrind reported something; \
          read the artifact before promoting this step to gating"
      - name: Upload valgrind logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valgrind-logs
          path: vg-*.log
          retention-days: 7

  windows-mingw:
    name: Windows mingw64
    runs-on: windows-2022
    timeout-minutes: 60
    continue-on-error: true
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            base-devel autotools autoconf2.71
            git
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-libevent
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-zlib
      - name: Configure and build
        # autoconf 2.73 rejects tor's configure.ac; pin 2.71
        env:
          WANT_AUTOCONF: "2.71"
        run: |
          # The revision is only embedded when git can read this checkout.
          # MSYS2 git and the Windows checkout disagree about ownership
          # often enough that it is worth saying the path is trusted; the
          # runner is thrown away after the job.
          git config --global --add safe.directory '*'
          autoreconf-2.71 -if || autoreconf -if
          # Link openssl/libevent/zlib and the mingw runtime statically so the
          # published tor.exe is self-contained: users download one file and
          # run it, with no mingw DLLs to install alongside. LDFLAGS=-static
          # pulls in libgcc/libwinpthread/libssp too.
          ./configure --disable-asciidoc --enable-fatal-warnings \
            --enable-static-tor \
            --with-openssl-dir=/mingw64 \
            --with-libevent-dir=/mingw64 \
            --with-zlib-dir=/mingw64 \
            LDFLAGS=-static
          make

      - name: Prepare production binary
        run: |
          # This shipped an empty revision for as long as the job existed,
          # which is invisible unless someone reads the string. Fail loudly
          # instead: a binary that cannot name its commit is not much use
          # for reporting a bug against.
          rev=$(cat micro-revision.i)
          echo "micro-revision.i: $rev"
          if [ "$rev" = '""' ]; then
            echo "::error::no git revision embedded; tor --version will not name a commit"
            exit 1
          fi
          cp src/app/tor.exe src/app/tor-production-windows-mingw64.exe
          strip src/app/tor-production-windows-mingw64.exe 2>/dev/null || :

      - name: Unit tests
        # Not gating yet. Upstream's own CI has no Windows job at all, so
        # there is no precedent for which of tor's tests pass here, and this
        # build uses --enable-static-tor, which the test binaries were never
        # asked to link against. Find out what happens before deciding what
        # a failure here should mean.
        continue-on-error: true
        run: |
          make -j2 src/test/test.exe src/test/test_workqueue.exe
          ./src/test/test.exe
          ./src/test/test_workqueue.exe
          ./src/test/test_workqueue.exe -T 16

      - name: Verify the binary is self-contained
        # Guard against silently shipping a dynamically linked exe. tor.exe may
        # import only Windows system DLLs; any mingw runtime DLL means the
        # static link did not take and the download would not run standalone.
        run: |
          echo "=== DLL imports of tor-production-windows-mingw64.exe ==="
          objdump -p src/app/tor-production-windows-mingw64.exe \
            | grep 'DLL Name' | sort -u
          if objdump -p src/app/tor-production-windows-mingw64.exe \
               | grep 'DLL Name' \
               | grep -iqE 'lib(crypto|ssl|event|gcc|winpthread|ssp|lzma|zstd|stdc\+\+|brotli)|zlib1'; then
            echo "::error::tor.exe still depends on mingw DLLs; static link failed"
            exit 1
          fi
          echo "OK: only Windows system DLLs imported -- self-contained."

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: tor-windows-mingw64-production
          path: src/app/tor-production-windows-mingw64.exe
          retention-days: 30

  raspberry-pi:
    name: Raspberry Pi aarch64
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build inside arm64 Ubuntu container
        run: |
          docker run --platform linux/arm64 --rm -v $PWD:/work -w /work \
            arm64v8/ubuntu:24.04 bash -c "
            set -e
            apt-get update -q
            apt-get install -y -q build-essential automake autoconf \
              libtool pkg-config libevent-dev libssl-dev zlib1g-dev \
              liblzma-dev libzstd-dev libsystemd-dev git
            # micro-revision.i is only written when both a .git and a git
            # binary are present, and this image ships neither by default,
            # so the binary went out reporting an empty revision. The
            # checkout is bind-mounted and owned by the runner user while
            # this shell is root, which git refuses to read as its own
            # repository unless told the path is trusted.
            git config --global --add safe.directory /work
            ./autogen.sh
            # --enable-systemd rather than the default autodetection: the
            # Raspberry Pi binary replaces a distribution tor, whose unit
            # file is Type=notify, and a tor built without sd_notify never
            # reports readiness. Autodetection would drop the feature and
            # still exit 0 if libsystemd-dev failed to install; this errors.
            ./configure --disable-asciidoc --enable-systemd
            make -j4 src/app/tor
            rev=\$(cat micro-revision.i)
            echo \"micro-revision.i: \$rev\"
            if [ \"\$rev\" = '\"\"' ]; then
              echo '::error::no git revision embedded; tor --version will not name a commit'
              exit 1
            fi
            cp src/app/tor src/app/tor-production-raspberry-pi-aarch64
            strip src/app/tor-production-raspberry-pi-aarch64

            # This is the only arm64 we build on, and until now it only
            # compiled. That is the wrong way round for this branch: the
            # changes here are to thread synchronisation, aarch64 has a
            # weaker memory model than x86-64, and #41209 was reported from
            # an arm64 machine. Everything under QEMU is slow, so run the
            # parts that bear on those changes rather than the whole suite.
            make -j4 src/test/test src/test/test_workqueue \
                 src/test/test_workqueue_shutdown
            ./src/test/test
            ./src/test/test_workqueue
            ./src/test/test_workqueue -T 16
            for v in cancel pipe pipe2 socketpair efd efd2; do
              rc=0
              sh \"src/test/test_workqueue_\${v}.sh\" || rc=\$?
              # 77 is automake's skip code, which the eventfd variants use
              # when the kernel does not offer them.
              if [ \"\$rc\" -ne 0 ] && [ \"\$rc\" -ne 77 ]; then
                echo \"variant \$v failed rc=\$rc\"
                exit 1
              fi
            done
            # QEMU is slow enough that the binary's own deadline would fire
            # on a run that was going to pass, so widen it.
            TOR_TEST_WORKQUEUE_DEADLINE=600 \
              sh src/test/test_workqueue_shutdown.sh

            make clean
            ./configure --enable-fragile-hardening --disable-asciidoc
            make -j4 src/app/tor
            cp src/app/tor src/app/tor-debug-raspberry-pi-aarch64
            "

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: tor-raspberry-pi-aarch64-production
          path: src/app/tor-production-raspberry-pi-aarch64
          retention-days: 30

      - name: Upload debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: tor-raspberry-pi-aarch64-debug
          path: src/app/tor-debug-raspberry-pi-aarch64
          retention-days: 30

  publish-pre-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/ci/pipelines'
    needs: [build-test, tsan-workqueue, asan-workqueue, windows-mingw,
            raspberry-pi, coverage]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Ahead of the download, which is only ordering: checkout cleans the
      # workspace and would remove the artifacts if it ran second. The tree
      # is wanted for configure.ac, to read the version out of.
      - uses: actions/checkout@v4

      # Without a pattern this takes every artifact the run produced. The
      # coverage and valgrind jobs are not in "needs", but they usually
      # finish first, so their output was being attached to the release:
      # roughly three hundred .gcov files and seven valgrind logs, none of
      # which anyone downloading a binary wants. The binary artifacts are
      # the ones named tor-*.
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: tor-*
          merge-multiple: true

      - name: Generate release tag
        run: |
          # The version was written out here by hand and had gone stale: the
          # tag said 0.4.8.18-dev while configure.ac, and so every binary in
          # the release, said 0.5.0.0-alpha-dev. Read it from the file the
          # build reads, and the two cannot drift apart again.
          ver=$(sed -n 's/^AC_INIT(\[tor\],\[\(.*\)\])$/\1/p' configure.ac)
          if [ -z "$ver" ]; then
            echo "::error::no version found in configure.ac; refusing to tag"
            exit 1
          fi
          echo "RELEASE_TAG=${ver}.$(date +%Y%m%d.%H%M%S)" >> $GITHUB_ENV
          # Sixteen characters because that is what "git rev-parse --short=16"
          # writes into micro-revision.i, so this matches the string the
          # binaries print byte for byte.
          echo "SHORT_SHA=${GITHUB_SHA::16}" >> $GITHUB_ENV

      - name: Create pre-release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          make_latest: false
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Pre-release ${{ env.RELEASE_TAG }}"
          body: |
            Automated pre-release from the ci/pipelines branch.

            Built from ${{ env.SHORT_SHA }}. Every binary here carries that string: `tor --version` prints `(git-${{ env.SHORT_SHA }})`, so a binary can always be matched back to its source.

            Test coverage of this branch's own changes: ${{ needs.coverage.outputs.hit }} of ${{ needs.coverage.outputs.total }} executable lines (${{ needs.coverage.outputs.pct }}%). The denominator is the lines this branch adds on top of this repository's `main`, leaving out comments and declarations. Two things are set aside from it: ${{ needs.coverage.outputs.excluded }} line(s) the source marks `LCOV_EXCL` as unreachable, and ${{ needs.coverage.outputs.nodata }} line(s) in files this build does not compile. Charging both as untested gives ${{ needs.coverage.outputs.strict }}% of ${{ needs.coverage.outputs.strict_total }}. Neither figure says anything about the tree as a whole.

            Includes production (stripped, optimized) and debug (fragile-hardening, with symbols) builds for:
            - Ubuntu 22.04 (gcc)
            - Ubuntu 24.04 (clang)
            - Ubuntu 22.04 arm64 (gcc)
            - Ubuntu 24.04 arm64 (clang)
            - macOS 14 (clang)
            - macOS 15 (clang)
            - Raspberry Pi aarch64 (QEMU arm64 container)
            - Windows mingw64 (production only)

            Naming: `<platform>-<cc>-[production|debug]`

            Production binaries are stripped and need nothing beyond the usual libevent/openssl/zlib for the platform. The Windows one is statically linked and needs no mingw DLLs.

            tor-production-raspberry-pi-aarch64 is built --enable-systemd and also links libsystemd.so.0, which is already present on a machine running systemd. It reports readiness with sd_notify, so it can replace a distribution tor under that distribution's `Type=notify` unit file. The other production binaries are built without systemd support and will be killed at `TimeoutStartSec` under such a unit.

            Debug binaries are built with --enable-fragile-hardening, which links AddressSanitizer. gcc links that runtime as a shared library while clang on Linux links it into the binary, so only some of these need anything installed. Where one is listed, the binary will not start without it:

            - tor-debug-ubuntu-22.04-gcc, tor-debug-ubuntu-22.04-arm-gcc
              `apt install libasan6`
            - tor-debug-raspberry-pi-aarch64
              `apt install libasan8`
            - tor-debug-macos-14-clang, tor-debug-macos-15-clang
              libclang_rt.asan_osx_dynamic.dylib, from a matching Xcode or
              LLVM install; there is no package for it on its own
            - tor-debug-ubuntu-24.04-clang, tor-debug-ubuntu-24.04-arm-clang
              nothing
            - Windows: no debug binary is published, the mingw environment
              has no AddressSanitizer runtime

            Each Linux production binary has a matching `*-debuginfo` file. Download both, keep them in the same directory, and gdb and perf will find the symbols on their own: the pair is matched by GNU build-id, which makes this the only artifact that can symbolicate the binary you are actually running. The hardened debug binary is a separate compilation with a different build-id and cannot stand in for it. Profile with `perf record --call-graph dwarf`, since the production build carries no frame pointers.

            ⚠️ Found a bug? Please open an issue at
            https://github.com/KernelKraze/The-Onion-Router/issues
          files: artifacts/*
          fail_on_unmatched_files: false
