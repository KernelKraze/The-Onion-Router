name: CI

# ⚠️ Found a bug? Please open an issue at
#    https://github.com/KernelKraze/The-Onion-Router/issues

on:
  push:
    branches: ['ci/**', 'refactor/**']
  pull_request:
    branches: ['ci/**', 'refactor/**']
  workflow_dispatch:

env:
  MAKEFLAGS: -j4

jobs:
  build-test:
    name: ${{ matrix.os }} / ${{ matrix.cc }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            cc: gcc
          - os: ubuntu-24.04
            cc: clang
          - os: macos-14
            cc: clang
          - os: macos-15
            cc: clang
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q build-essential automake autoconf \
            libtool pkg-config libevent-dev libssl-dev zlib1g-dev \
            liblzma-dev libzstd-dev python3

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install automake autoconf libtool libevent openssl@3 xz zstd pkg-config

      - name: Configure
        run: |
          ./autogen.sh
          if [ "${{ runner.os }}" = "macOS" ]; then
            CC=${{ matrix.cc }} ./configure --enable-fatal-warnings --disable-asciidoc \
              --with-openssl-dir="$(brew --prefix openssl@3)" \
              --with-libevent-dir="$(brew --prefix libevent)"
          else
            CC=${{ matrix.cc }} ./configure --enable-fatal-warnings --disable-asciidoc
          fi

      - name: Build
        run: make

      - name: Unit tests
        run: make check

      - name: Workqueue alert-mechanism variants
        # exit 77 is the automake skip code (eventfd/pipe2 on macOS)
        run: |
          ./src/test/test_workqueue
          ./src/test/test_workqueue -T 16
          for v in pipe socketpair pipe2 efd efd2; do
            rc=0
            sh "src/test/test_workqueue_${v}.sh" || rc=$?
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 77 ]; then
              echo "variant $v failed rc=$rc"
              exit 1
            fi
          done

      - name: Shutdown-race reproducer (41148)
        run: |
          ${{ matrix.cc }} -std=gnu11 -DHAVE_CONFIG_H -DTOR_UNIT_TESTS -O2 \
            -I. -I./src -I./src/ext -I./src/ext/trunnel -I./src/trunnel \
            -I./src/ext/equix/hashx/include \
            $(pkg-config --cflags libevent openssl 2>/dev/null) \
            -c scripts/ci/repro_41148.c -o repro.o
          if [ "${{ runner.os }}" = "macOS" ]; then
            LDD="-L$(brew --prefix libevent)/lib -L$(brew --prefix openssl@3)/lib -L$(brew --prefix xz)/lib -L$(brew --prefix zstd)/lib"
          else
            LDD=""
          fi
          ${{ matrix.cc }} -o repro repro.o src/test/libtor-testing.a \
            $LDD -levent -lssl -lcrypto -lz -llzma -lzstd -lpthread -lm
          # perl alarm: macOS runners have no timeout(1)
          perl -e 'alarm 120; exec @ARGV' ./repro
          perl -e 'alarm 120; exec @ARGV' ./repro idle
          perl -e 'alarm 120; exec @ARGV' ./repro update

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.os }}-${{ matrix.cc }}
          path: |
            test-suite.log
            config.log
          retention-days: 7

      - name: Prepare production binary
        run: |
          plat="${{ matrix.os }}-${{ matrix.cc }}"
          cp src/app/tor "src/app/tor-production-${plat}"
          strip "src/app/tor-production-${plat}" 2>/dev/null || :

      - name: Build hardened (debug) binary
        run: |
          make clean
          ./autogen.sh
          if [ "${{ runner.os }}" = "macOS" ]; then
            CC=${{ matrix.cc }} ./configure --enable-fatal-warnings \
              --enable-fragile-hardening --disable-asciidoc \
              --with-openssl-dir="$(brew --prefix openssl@3)" \
              --with-libevent-dir="$(brew --prefix libevent)"
          else
            CC=${{ matrix.cc }} ./configure --enable-fatal-warnings \
              --enable-fragile-hardening --disable-asciidoc
          fi
          make -j4 src/app/tor
          plat="${{ matrix.os }}-${{ matrix.cc }}"
          cp src/app/tor "src/app/tor-debug-${plat}"

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: tor-${{ matrix.os }}-${{ matrix.cc }}-production
          path: src/app/tor-production-${{ matrix.os }}-${{ matrix.cc }}
          retention-days: 30

      - name: Upload debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: tor-${{ matrix.os }}-${{ matrix.cc }}-debug
          path: src/app/tor-debug-${{ matrix.os }}-${{ matrix.cc }}
          retention-days: 30

  tsan-workqueue:
    name: TSan workqueue
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q build-essential automake autoconf \
            libtool pkg-config libevent-dev libssl-dev zlib1g-dev \
            liblzma-dev libzstd-dev clang

      - name: Configure with ThreadSanitizer
        run: |
          ./autogen.sh
          CC=clang \
          CFLAGS="-fsanitize=thread -O1 -g -fno-omit-frame-pointer" \
          LDFLAGS="-fsanitize=thread" \
          ./configure --disable-asciidoc --disable-gcc-hardening

      - name: Build workqueue test
        run: |
          make micro-revision.i
          make src/test/test_workqueue

      - name: Run under TSan
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: |
          ./src/test/test_workqueue
          ./src/test/test_workqueue -T 16
          for v in pipe socketpair pipe2 efd efd2; do
            rc=0
            sh "src/test/test_workqueue_${v}.sh" || rc=$?
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 77 ]; then
              echo "variant $v failed rc=$rc"
              exit 1
            fi
          done

      - name: Reproducer under TSan
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: |
          clang -std=gnu11 -DHAVE_CONFIG_H -DTOR_UNIT_TESTS \
            -fsanitize=thread -O1 -g \
            -I. -I./src -I./src/ext -I./src/ext/trunnel -I./src/trunnel \
            -I./src/ext/equix/hashx/include \
            -c scripts/ci/repro_41148.c -o repro.o
          clang -fsanitize=thread -o repro repro.o src/test/libtor-testing.a \
            -levent -lssl -lcrypto -lz -llzma -lzstd -lpthread -lm
          timeout 300 ./repro
          timeout 300 ./repro idle
          timeout 300 ./repro update

  asan-workqueue:
    name: ASan/UBSan workqueue
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q build-essential automake autoconf \
            libtool pkg-config libevent-dev libssl-dev zlib1g-dev \
            liblzma-dev libzstd-dev clang

      - name: Configure with fragile hardening
        run: |
          ./autogen.sh
          CC=clang ./configure --enable-fragile-hardening --disable-asciidoc

      - name: Build
        run: make

      - name: Unit tests under ASan
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: ./src/test/test

      # The build matrix runs this through "make check", but those builds
      # carry no sanitizer, so an overflow of a few bytes stays inside the
      # heap and passes silently. This is the only job where the cell
      # parsers are actually instrumented.
      - name: Cell parser boundary cases under ASan
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ./src/test/test_fuzz_cell.sh

      - name: Workqueue and reproducer under ASan with leak check
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: |
          ./src/test/test_workqueue
          ./src/test/test_workqueue -T 16
          clang -std=gnu11 -DHAVE_CONFIG_H -DTOR_UNIT_TESTS \
            -fsanitize=address,undefined -O1 -g \
            -I. -I./src -I./src/ext -I./src/ext/trunnel -I./src/trunnel \
            -I./src/ext/equix/hashx/include \
            -c scripts/ci/repro_41148.c -o repro.o
          clang -fsanitize=address,undefined -o repro repro.o \
            src/test/libtor-testing.a \
            -levent -lssl -lcrypto -lz -llzma -lzstd -lpthread -lm
          timeout 300 ./repro
          timeout 300 ./repro idle
          timeout 300 ./repro update

  windows-mingw:
    name: Windows mingw64
    runs-on: windows-2022
    timeout-minutes: 60
    continue-on-error: true
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            base-devel autotools autoconf2.71
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-libevent
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-zlib
      - name: Configure and build
        # autoconf 2.73 rejects tor's configure.ac; pin 2.71
        env:
          WANT_AUTOCONF: "2.71"
        run: |
          autoreconf-2.71 -if || autoreconf -if
          ./configure --disable-asciidoc --enable-fatal-warnings
          make

      - name: Prepare production binary
        run: |
          cp src/app/tor.exe src/app/tor-production-windows-mingw64.exe
          strip src/app/tor-production-windows-mingw64.exe 2>/dev/null || :

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: tor-windows-mingw64-production
          path: src/app/tor-production-windows-mingw64.exe
          retention-days: 30

  raspberry-pi:
    name: Raspberry Pi aarch64
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build inside arm64 Ubuntu container
        run: |
          docker run --platform linux/arm64 --rm -v $PWD:/work -w /work \
            arm64v8/ubuntu:24.04 bash -c "
            set -e
            apt-get update -q
            apt-get install -y -q build-essential automake autoconf \
              libtool pkg-config libevent-dev libssl-dev zlib1g-dev \
              liblzma-dev libzstd-dev
            ./autogen.sh
            ./configure --disable-asciidoc
            make -j4 src/app/tor
            cp src/app/tor src/app/tor-production-raspberry-pi-aarch64
            strip src/app/tor-production-raspberry-pi-aarch64
            make clean
            ./configure --enable-fragile-hardening --disable-asciidoc
            make -j4 src/app/tor
            cp src/app/tor src/app/tor-debug-raspberry-pi-aarch64
            "

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: tor-raspberry-pi-aarch64-production
          path: src/app/tor-production-raspberry-pi-aarch64
          retention-days: 30

      - name: Upload debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: tor-raspberry-pi-aarch64-debug
          path: src/app/tor-debug-raspberry-pi-aarch64
          retention-days: 30

  publish-pre-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/ci/github-actions'
    needs: [build-test, tsan-workqueue, asan-workqueue, windows-mingw, raspberry-pi]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate release tag
        run: echo "RELEASE_TAG=0.4.8.18-dev.$(date +%Y%m%d.%H%M%S)" >> $GITHUB_ENV

      - name: Create pre-release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          make_latest: false
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Pre-release ${{ env.RELEASE_TAG }}"
          body: |
            Automated pre-release from ci/github-actions branch.

            Includes production (stripped, optimized) and debug (fragile-hardening, with symbols) builds for:
            - Ubuntu 22.04 (gcc)
            - Ubuntu 24.04 (clang)
            - macOS 14 (clang)
            - macOS 15 (clang)
            - Raspberry Pi aarch64 (QEMU arm64 container)
            - Windows mingw64

            Naming: `<platform>-<cc>-[production|debug]`
            ⚠️ Found a bug? Please open an issue at
            https://github.com/KernelKraze/The-Onion-Router/issues
          files: artifacts/*
          fail_on_unmatched_files: false
