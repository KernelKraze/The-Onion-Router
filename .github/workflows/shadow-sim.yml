name: Shadow network simulation

# Full-network A/B simulation. Heavy job: run on demand or weekly,
# never on every push.
#
# Three stages, so the two arms run at the same time. Measured on the
# 2026-07-29 run: setup 6 min, each simulation 2h13m, parse 2 min. Run one
# after the other that is 4h34m; run side by side it is about 2h25m, and each
# arm gets its own six-hour job limit instead of the two sharing one.
#
# shadow.data is tens of gigabytes, so it must not travel between jobs. Each
# arm parses its own results and hands on only tornet.plot.data, which is a
# few hundred kilobytes.
on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Baseline ref to compare against
        default: main
      network_scale:
        description: Fraction of the real Tor network to model
        default: "0.005"
      sim_time:
        description: Simulated duration
        default: "30 minutes"
      converge_time:
        description: Seconds of simulated time to discard as warm-up
        default: "600"
      onion_service_user_scale:
        description: Multiplier for onion-service users and servers (0 disables)
        default: "1.0"
      torperf_num_onion_service:
        description: Onion-service perf clients (these produce the .onionservice metrics)
        default: "100"
      seed:
        description: RNG seed (leave blank for random)
        default: ""
  schedule:
    - cron: '0 2 * * 6'

env:
  # Pin shadow to a release tag. Bump deliberately, never track master.
  SHADOW_VERSION: v3.3.0
  BASE_REF: ${{ github.event.inputs.base_ref || 'main' }}
  # Memory is not the limit: the 0.005 run peaked at 1.88 GiB. Wall clock is.
  # One simulation takes a little over two hours at this scale, and
  # onion-service traffic rides six-hop circuits, so raising the scale and the
  # duration together will not fit even with the arms running side by side.
  SCALE: ${{ github.event.inputs.network_scale || '0.005' }}
  SIM_TIME: ${{ github.event.inputs.sim_time || '30 minutes' }}
  # tornettools discards everything before this point when it parses, so a run
  # shorter than the converge time yields no metrics at all. Its own default is
  # 1200, which is longer than the simulations we can afford.
  CONVERGE_TIME: ${{ github.event.inputs.converge_time || '600' }}
  HS_USER_SCALE: ${{ github.event.inputs.onion_service_user_scale || '1.0' }}
  HS_PERF_CLIENTS: ${{ github.event.inputs.torperf_num_onion_service || '100' }}

jobs:
  setup:
    name: Build and generate the network
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      seed: ${{ steps.seed.outputs.seed }}
    steps:
      - name: Checkout patched tree
        uses: actions/checkout@v4
        with:
          path: tor-patched

      - name: Checkout baseline tree
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_REF }}
          path: tor-baseline

      - name: Generate simulation seed
        id: seed
        run: |
          if [ -n "${{ github.event.inputs.seed }}" ]; then
            SEED="${{ github.event.inputs.seed }}"
          else
            SEED=$(od -An -N4 -tu4 /dev/urandom | tr -d ' ')
          fi
          echo "SEED=$SEED" >> "$GITHUB_ENV"
          echo "seed=$SEED" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q build-essential automake autoconf \
            libtool pkg-config libevent-dev libssl-dev zlib1g-dev \
            cmake libglib2.0-dev libigraph-dev netbase python3-venv \
            python3-networkx xz-utils util-linux faketime dstat procps \
            python3-matplotlib python3-scipy python3-numpy wget

      - name: Restore shadow build cache
        id: shadow-cache
        uses: actions/cache@v4
        with:
          path: ~/.local
          key: shadow-${{ env.SHADOW_VERSION }}-${{ runner.os }}-ubuntu24

      - name: Build shadow (cache miss only)
        if: steps.shadow-cache.outputs.cache-hit != 'true'
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
            sh -s -- -y --default-toolchain stable
          source "$HOME/.cargo/env"
          git clone --depth 1 --branch "$SHADOW_VERSION" \
            https://github.com/shadow/shadow.git
          cd shadow
          ./setup build --clean --prefix="$HOME/.local" -j"$(nproc)"
          ./setup install
          cd ..
          git clone --depth 1 https://github.com/shadow/tgen.git
          cmake -S tgen -B tgen/build -DCMAKE_INSTALL_PREFIX="$HOME/.local"
          make -C tgen/build -j"$(nproc)" install
          git clone --depth 1 https://github.com/shadow/oniontrace.git
          cmake -S oniontrace -B oniontrace/build -DCMAKE_INSTALL_PREFIX="$HOME/.local"
          make -C oniontrace/build -j"$(nproc)" install

      - name: Add shadow to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build both tor binaries
        run: |
          for tree in tor-baseline tor-patched; do
            cd "$tree"
            ./autogen.sh
            ./configure --disable-asciidoc
            make -j"$(nproc)"
            cd ..
          done
          # tornettools bakes ~/.local/bin/tor into shadow.config.yaml (its
          # standard install convention) and needs tor on PATH to generate the
          # onion-service keys, so the baseline goes there for the generate
          # step. Each simulation job installs its own arm's binary over it.
          mkdir -p "$HOME/.local/bin"
          cp tor-baseline/src/app/tor "$HOME/.local/bin/tor"
          cp tor-baseline/src/tools/tor-gencert "$HOME/.local/bin/tor-gencert"

      - name: Refuse to compare a binary with itself
        run: |
          # If BASE_REF resolves to the same tree, the run would report "no
          # difference" for entirely the wrong reason.
          a=$(sha256sum tor-baseline/src/app/tor | cut -d' ' -f1)
          b=$(sha256sum tor-patched/src/app/tor  | cut -d' ' -f1)
          echo "baseline $a"
          echo "patched  $b"
          if [ "$a" = "$b" ]; then
            echo "::error::the two tor binaries are identical; nothing to compare"
            exit 1
          fi

      - name: Install tornettools
        run: |
          git clone --depth 1 https://github.com/shadow/tornettools.git
          python3 -m venv toolsenv
          . toolsenv/bin/activate
          pip install -q 'numpy<2.0'
          pip install -q -r tornettools/requirements.txt
          pip install -q 'tgentools @ git+https://github.com/shadow/tgen.git#subdirectory=tools'
          pip install -q 'oniontracetools @ git+https://github.com/shadow/oniontrace.git#subdirectory=tools'
          pip install -q ./tornettools

      - name: Restore staged network data cache
        id: stage-cache
        uses: actions/cache@v4
        with:
          path: staged
          # v2: the staged set now carries tor_metrics_*.json as well.
          key: tornettools-staged-2023-04-v2

      - name: Stage network data (cache miss only)
        if: steps.stage-cache.outputs.cache-hit != 'true'
        run: |
          . toolsenv/bin/activate
          # -nv rather than -q: on failure wget still logs the URL and the HTTP
          # status, so the broken source is identifiable.
          WGET="wget -nv --tries=3 --retry-connrefused"
          $WGET https://collector.torproject.org/archive/relay-descriptors/consensuses/consensuses-2023-04.tar.xz
          $WGET https://collector.torproject.org/archive/relay-descriptors/server-descriptors/server-descriptors-2023-04.tar.xz
          $WGET https://metrics.torproject.org/userstats-relay-country.csv
          $WGET https://collector.torproject.org/archive/onionperf/onionperf-2023-04.tar.xz
          $WGET -O bandwidth-2023-04.csv "https://metrics.torproject.org/bandwidth.csv?start=2023-04-01&end=2023-04-30"
          tar xaf consensuses-2023-04.tar.xz
          tar xaf server-descriptors-2023-04.tar.xz
          tar xaf onionperf-2023-04.tar.xz
          git clone --depth 1 https://github.com/tmodel-ccs2018/tmodel-ccs2018.github.io.git
          tornettools stage \
            consensuses-2023-04 \
            server-descriptors-2023-04 \
            userstats-relay-country.csv \
            tmodel-ccs2018.github.io \
            --onionperf_data_path onionperf-2023-04 \
            --bandwidth_data_path bandwidth-2023-04.csv \
            --geoip_path tor-baseline/src/config/geoip
          mkdir -p staged
          mv relayinfo_staging_* userinfo_staging_* networkinfo_staging.gml staged/
          # tor_metrics_*.json is what "plot --tor_metrics_path" wants, and not
          # keeping it is why the plot step had no reference data.
          if ls tor_metrics_*.json >/dev/null 2>&1; then
            mv tor_metrics_*.json staged/
          else
            echo "::warning::staging produced no tor_metrics_*.json"
          fi
          cp -r tmodel-ccs2018.github.io staged/

      - name: Generate network
        run: |
          . toolsenv/bin/activate
          tornettools generate \
            staged/relayinfo_staging_2023-04-01--2023-04-30.json \
            staged/userinfo_staging_2023-04-01--2023-04-30.json \
            staged/networkinfo_staging.gml \
            staged/tmodel-ccs2018.github.io \
            --network_scale "$SCALE" \
            --onion_service_user_scale "$HS_USER_SCALE" \
            --torperf_num_onion_service "$HS_PERF_CLIENTS" \
            --prefix tornet
          # Both flags are needed. onion_service_user_scale is what creates the
          # onion-service servers, and it defaults to 0, so asking for perf
          # clients alone would leave them with nothing to connect to.
          python3 - "$SIM_TIME" <<'EOF'
          import os, sys, yaml
          with open("tornet/shadow.config.yaml") as f:
              cfg = yaml.safe_load(f)
          cfg.setdefault("host_option_defaults", {})
          cfg["host_option_defaults"]["pcap_enabled"] = False
          cfg["general"]["stop_time"] = sys.argv[1]
          cfg["general"]["seed"] = int(os.environ["SEED"])
          with open("tornet/shadow.config.yaml", "w") as f:
              yaml.dump(cfg, f, sort_keys=False)

          # Check the generated network here rather than downstream: the only
          # record of what was generated, simulation_info.json, is written by
          # the parse step, which is hours of simulation away. The host list is
          # available now and says the same thing.
          hosts = cfg["hosts"]
          hs = sorted(h for h in hosts if "onionservice" in h)
          print(f"{len(hosts)} hosts, of which {len(hs)} carry onion-service"
                f" traffic")
          if not hs:
              raise SystemExit("no onion-service hosts generated; every "
                               ".onionservice metric would come back empty")
          EOF
          # parallelism is deliberately left alone here and set in each
          # simulation job, which is where the core count actually applies.
          du -sh tornet

      - name: Hand the network and both binaries to the simulation jobs
        uses: actions/upload-artifact@v4
        with:
          name: shadow-setup
          path: |
            tornet
            tor-baseline/src/app/tor
            tor-patched/src/app/tor
          retention-days: 1
          if-no-files-found: error

  simulate:
    name: Simulate (${{ matrix.arm }})
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      # One arm failing should not cancel the other: a half result still tells
      # us whether that arm crashed.
      fail-fast: false
      matrix:
        include:
          - arm: baseline
            net: tornet
          - arm: patched
            net: tornet-patched
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libevent-dev libssl-dev zlib1g-dev \
            libglib2.0-dev libigraph-dev netbase python3-venv xz-utils \
            util-linux procps git

      - name: Restore shadow build cache
        id: shadow-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.local
          key: shadow-${{ env.SHADOW_VERSION }}-${{ runner.os }}-ubuntu24

      - name: Refuse to run without shadow
        if: steps.shadow-cache.outputs.cache-hit != 'true'
        run: |
          echo "::error::shadow build cache missed; the setup job populates it."
          exit 1

      - name: Add shadow to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Fetch the generated network and the binaries
        uses: actions/download-artifact@v4
        with:
          name: shadow-setup

      - name: Install this arm's tor and name its directory
        run: |
          # tornettools baked ~/.local/bin/tor into shadow.config.yaml, so the
          # arm is chosen purely by which binary sits at that path.
          if [ "${{ matrix.arm }}" = "baseline" ]; then
            src=tor-baseline/src/app/tor
          else
            src=tor-patched/src/app/tor
          fi
          chmod +x "$src"
          cp "$src" "$HOME/.local/bin/tor"
          "$HOME/.local/bin/tor" --version
          # tornettools labels a dataset by its directory name, so the name has
          # to be what the analyze job expects.
          if [ "${{ matrix.net }}" != "tornet" ]; then
            mv tornet "${{ matrix.net }}"
          fi
          python3 - "${{ matrix.net }}" <<'EOF'
          import os, sys, yaml
          p = f"{sys.argv[1]}/shadow.config.yaml"
          with open(p) as f:
              cfg = yaml.safe_load(f)
          cfg["general"]["parallelism"] = os.cpu_count()
          with open(p, "w") as f:
              yaml.dump(cfg, f, sort_keys=False)
          print("parallelism", cfg["general"]["parallelism"],
                "seed", cfg["general"]["seed"],
                "stop_time", cfg["general"]["stop_time"])
          EOF

      - name: Run the simulation
        run: |
          cd "${{ matrix.net }}"
          /usr/bin/time -v shadow shadow.config.yaml > shadow.stdout 2> shadow.time
          tail -5 shadow.time

      - name: Check for tor errors
        run: |
          net="${{ matrix.net }}"
          errs=$(grep -rl --include='*.log' '\[err\]' "$net/shadow.data/hosts" | head -5 || true)
          bugs=$(grep -rh --include='*.log' 'Bug:' "$net/shadow.data/hosts" | sort -u | head -10 || true)
          if [ -n "$errs" ] || [ -n "$bugs" ]; then
            echo "$net: tor errors detected"
            echo "$errs"
            echo "$bugs"
            exit 1
          fi
          echo "$net: no tor errors"

      - name: Install tornettools
        run: |
          git clone --depth 1 https://github.com/shadow/tornettools.git
          python3 -m venv toolsenv
          . toolsenv/bin/activate
          pip install -q 'numpy<2.0'
          pip install -q -r tornettools/requirements.txt
          pip install -q 'tgentools @ git+https://github.com/shadow/tgen.git#subdirectory=tools'
          pip install -q 'oniontracetools @ git+https://github.com/shadow/oniontrace.git#subdirectory=tools'
          pip install -q ./tornettools

      - name: Parse this arm
        run: |
          . toolsenv/bin/activate
          # Every extractor except client goodput drops samples earlier than
          # --converge-time, and tornettools defaults it to 1200. A simulation
          # shorter than that filters out all of its own data.
          tornettools parse "${{ matrix.net }}" --converge-time "$CONVERGE_TIME"
          # Report how much survived, so an empty result is visible here rather
          # than only on opening the artifact.
          python3 - "${{ matrix.net }}" <<'EOF'
          import glob, json, os, sys
          net = sys.argv[1]
          for path in sorted(glob.glob(f"{net}/tornet.plot.data/*.json")):
              name = os.path.basename(path)
              d = json.load(open(path))
              if name == "simulation_info.json":
                  print(f"  {json.dumps(d, sort_keys=True)}")
                  continue
              # Three shapes turn up: a flat list; a dict of lists keyed by
              # transfer size; and a dict of plain numbers keyed by simulated
              # second, which is what relay_goodput is. Counting only lists
              # reports that last one as empty when it is in fact complete.
              if isinstance(d, list):
                  n = len(d)
              elif d and all(isinstance(v, (int, float)) for v in d.values()):
                  n = len(d)
              else:
                  n = sum(len(v) for v in d.values() if isinstance(v, list))
              print(f"  {n:7d}  {name}")
          EOF

      - name: Collect this arm's results
        if: always()
        run: |
          net="${{ matrix.net }}"
          mkdir -p "out/$net"
          cp -r "$net/tornet.plot.data" "out/$net/" 2>/dev/null || true
          cp "$net/shadow.time" "out/$net/" 2>/dev/null || true
          # tgentools and oniontracetools each write their own log, named with
          # an %H:%M:%S timestamp, and upload-artifact rejects colons, so
          # rename on the way out rather than lose the whole artifact.
          for log in "$net"/*tools.parse.*.log; do
            [ -e "$log" ] || continue
            cp "$log" "out/$net/$(basename "$log" | tr ':' '-')"
          done
          grep -rh 'error\|panic' "$net/shadow.data/shadow.log" 2>/dev/null | \
            head -50 > "out/$net/shadow-errors.txt" || true
          find out -type f | sort

      - name: Upload this arm's results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadow-arm-${{ matrix.arm }}
          path: out/
          retention-days: 14
          if-no-files-found: error

  analyze:
    name: Plot the comparison
    needs: [setup, simulate]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q python3-venv python3-matplotlib \
            python3-scipy python3-numpy git

      - name: Fetch both arms
        uses: actions/download-artifact@v4
        with:
          pattern: shadow-arm-*
          merge-multiple: true

      - name: Restore staged network data cache
        uses: actions/cache/restore@v4
        with:
          path: staged
          key: tornettools-staged-2023-04-v2

      - name: Install tornettools
        run: |
          git clone --depth 1 https://github.com/shadow/tornettools.git
          python3 -m venv toolsenv
          . toolsenv/bin/activate
          pip install -q 'numpy<2.0'
          pip install -q -r tornettools/requirements.txt
          pip install -q ./tornettools

      - name: Plot
        run: |
          . toolsenv/bin/activate
          find tornet tornet-patched -type f | sort
          # --tor_metrics_path takes the tor_metrics_*.json that staging
          # produces, not the tmodel directory, and --prefix is what decides
          # where the PDFs are written.
          metrics=$(ls staged/tor_metrics_*.json 2>/dev/null | head -1)
          mkdir -p pdfs
          if [ -n "$metrics" ]; then
            tornettools plot tornet tornet-patched \
              --tor_metrics_path "$metrics" --prefix pdfs
          else
            echo "::warning::no staged tor_metrics json; plotting without the \
          public Tor reference lines"
            tornettools plot tornet tornet-patched --prefix pdfs
          fi

      - name: Assemble the final artifact
        if: always()
        run: |
          mkdir -p results/pdfs
          cp -r tornet tornet-patched results/ 2>/dev/null || true
          # Collect only from the plot prefix: searching the whole workspace
          # also sweeps in matplotlib's bundled toolbar icons from the venv.
          cp pdfs/*.pdf results/pdfs/ 2>/dev/null || true
          echo "${{ needs.setup.outputs.seed }}" > results/seed.txt
          n=$(find results/pdfs -name '*.pdf' | wc -l | tr -d ' ')
          echo "collected $n plot PDFs"
          if [ "$n" -eq 0 ]; then
            echo "::warning::tornettools produced no PDFs; this run has no \
          quantified A/B comparison"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadow-sim-results
          path: results/
          retention-days: 14
