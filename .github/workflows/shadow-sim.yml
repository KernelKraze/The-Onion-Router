name: Shadow network simulation

# Full-network A/B simulation. Heavy job: run on demand or weekly,
# never on every push.
on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Baseline ref to compare against
        default: main
      network_scale:
        description: Fraction of the real Tor network to model
        default: "0.01"
      sim_time:
        description: Simulated duration
        default: "15 minutes"
      seed:
        description: RNG seed (leave blank for random)
        default: ""
  schedule:
    - cron: '0 2 * * 6'

env:
  # Pin shadow to a release tag. Bump deliberately, never track master.
  SHADOW_VERSION: v3.3.0
  BASE_REF: ${{ github.event.inputs.base_ref || 'main' }}
  # 0.01 is about the ceiling for a 4-vCPU / 16-GB hosted runner: at 0.002
  # a single simulation peaked at 1.88 GiB and took 19m45s, and both cost
  # and runtime grow with the scale. Going higher needs a larger runner.
  SCALE: ${{ github.event.inputs.network_scale || '0.01' }}
  SIM_TIME: ${{ github.event.inputs.sim_time || '15 minutes' }}


jobs:
  simulate:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout patched tree
        uses: actions/checkout@v4
        with:
          path: tor-patched

      - name: Checkout baseline tree
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_REF }}
          path: tor-baseline

      - name: Generate simulation seed
        run: |
          if [ -n "${{ github.event.inputs.seed }}" ]; then
            echo "SEED=${{ github.event.inputs.seed }}" >> "$GITHUB_ENV"
          else
            echo "SEED=$(od -An -N4 -tu4 /dev/urandom | tr -d ' ')" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q build-essential automake autoconf \
            libtool pkg-config libevent-dev libssl-dev zlib1g-dev \
            cmake libglib2.0-dev libigraph-dev netbase python3-venv \
            python3-networkx xz-utils util-linux faketime dstat procps \
            python3-matplotlib python3-scipy python3-numpy wget

      - name: Restore shadow build cache
        id: shadow-cache
        uses: actions/cache@v4
        with:
          path: ~/.local
          key: shadow-${{ env.SHADOW_VERSION }}-${{ runner.os }}-ubuntu24

      - name: Build shadow (cache miss only)
        if: steps.shadow-cache.outputs.cache-hit != 'true'
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
            sh -s -- -y --default-toolchain stable
          source "$HOME/.cargo/env"
          git clone --depth 1 --branch "$SHADOW_VERSION" \
            https://github.com/shadow/shadow.git
          cd shadow
          ./setup build --clean --prefix="$HOME/.local" -j"$(nproc)"
          ./setup install
          cd ..
          git clone --depth 1 https://github.com/shadow/tgen.git
          cmake -S tgen -B tgen/build -DCMAKE_INSTALL_PREFIX="$HOME/.local"
          make -C tgen/build -j"$(nproc)" install
          git clone --depth 1 https://github.com/shadow/oniontrace.git
          cmake -S oniontrace -B oniontrace/build -DCMAKE_INSTALL_PREFIX="$HOME/.local"
          make -C oniontrace/build -j"$(nproc)" install

      - name: Add shadow to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build both tor binaries
        run: |
          for tree in tor-baseline tor-patched; do
            cd "$tree"
            ./autogen.sh
            ./configure --disable-asciidoc
            make -j"$(nproc)"
            cd ..
          done
          # tornettools bakes ~/.local/bin/tor into shadow.config.yaml (its
          # standard install convention), so the binaries must live there.
          # Overwriting that file between runs swaps the binary without
          # regenerating the network.
          mkdir -p "$HOME/.local/bin"
          cp tor-baseline/src/app/tor "$HOME/.local/bin/tor"
          cp tor-baseline/src/tools/tor-gencert "$HOME/.local/bin/tor-gencert"

      - name: Install tornettools
        run: |
          git clone --depth 1 https://github.com/shadow/tornettools.git
          python3 -m venv toolsenv
          . toolsenv/bin/activate
          pip install -q 'numpy<2.0'
          pip install -q -r tornettools/requirements.txt
          pip install -q 'tgentools @ git+https://github.com/shadow/tgen.git#subdirectory=tools'
          pip install -q 'oniontracetools @ git+https://github.com/shadow/oniontrace.git#subdirectory=tools'
          pip install -q ./tornettools

      - name: Restore staged network data cache
        id: stage-cache
        uses: actions/cache@v4
        with:
          path: staged
          # v2: the staged set now carries tor_metrics_*.json as well.
          key: tornettools-staged-2023-04-v2

      - name: Stage network data (cache miss only)
        if: steps.stage-cache.outputs.cache-hit != 'true'
        run: |
          . toolsenv/bin/activate
          # -nv rather than -q: on failure wget still logs the URL and the
          # HTTP status, so the broken source is identifiable. With -q the
          # step only surfaced "exit code 8" for all five fetches.
          WGET="wget -nv --tries=3 --retry-connrefused"
          $WGET https://collector.torproject.org/archive/relay-descriptors/consensuses/consensuses-2023-04.tar.xz
          $WGET https://collector.torproject.org/archive/relay-descriptors/server-descriptors/server-descriptors-2023-04.tar.xz
          $WGET https://metrics.torproject.org/userstats-relay-country.csv
          $WGET https://collector.torproject.org/archive/onionperf/onionperf-2023-04.tar.xz
          $WGET -O bandwidth-2023-04.csv "https://metrics.torproject.org/bandwidth.csv?start=2023-04-01&end=2023-04-30"
          tar xaf consensuses-2023-04.tar.xz
          tar xaf server-descriptors-2023-04.tar.xz
          tar xaf onionperf-2023-04.tar.xz
          git clone --depth 1 https://github.com/tmodel-ccs2018/tmodel-ccs2018.github.io.git
          tornettools stage \
            consensuses-2023-04 \
            server-descriptors-2023-04 \
            userstats-relay-country.csv \
            tmodel-ccs2018.github.io \
            --onionperf_data_path onionperf-2023-04 \
            --bandwidth_data_path bandwidth-2023-04.csv \
            --geoip_path tor-baseline/src/config/geoip
          mkdir -p staged
          mv relayinfo_staging_* userinfo_staging_* networkinfo_staging.gml staged/
          # tor_metrics_*.json is what "plot --tor_metrics_path" wants, and not
          # keeping it is why the plot step had no reference data. Upstream
          # only documents it by using it, so warn rather than abort if this
          # version does not emit it: the plots still render without the
          # public Tor reference lines.
          if ls tor_metrics_*.json >/dev/null 2>&1; then
            mv tor_metrics_*.json staged/
          else
            echo "::warning::staging produced no tor_metrics_*.json"
          fi
          cp -r tmodel-ccs2018.github.io staged/

      - name: Generate network
        run: |
          . toolsenv/bin/activate
          tornettools generate \
            staged/relayinfo_staging_2023-04-01--2023-04-30.json \
            staged/userinfo_staging_2023-04-01--2023-04-30.json \
            staged/networkinfo_staging.gml \
            staged/tmodel-ccs2018.github.io \
            --network_scale "$SCALE" \
            --prefix tornet
          python3 - "$SIM_TIME" <<'EOF'
          import os, sys, yaml
          with open("tornet/shadow.config.yaml") as f:
              cfg = yaml.safe_load(f)
          cfg.setdefault("host_option_defaults", {})
          cfg["host_option_defaults"]["pcap_enabled"] = False
          cfg["general"]["stop_time"] = sys.argv[1]
          cfg["general"]["seed"] = int(os.environ["SEED"])
          cfg["general"]["parallelism"] = os.cpu_count()
          with open("tornet/shadow.config.yaml", "w") as f:
              yaml.dump(cfg, f, sort_keys=False)
          EOF

      - name: Run baseline simulation
        run: |
          cp -r tornet tornet-patched
          cd tornet
          /usr/bin/time -v shadow shadow.config.yaml > shadow.stdout 2> shadow.time
          tail -5 shadow.time

      - name: Run patched simulation (same runner, same network)
        run: |
          cp tor-patched/src/app/tor "$HOME/.local/bin/tor"
          cd tornet-patched
          /usr/bin/time -v shadow shadow.config.yaml > shadow.stdout 2> shadow.time
          tail -5 shadow.time

      - name: Check for tor errors in both simulations
        run: |
          status=0
          for net in tornet tornet-patched; do
            errs=$(grep -rl --include='*.log' '\[err\]' "$net/shadow.data/hosts" | head -5 || true)
            bugs=$(grep -rh --include='*.log' 'Bug:' "$net/shadow.data/hosts" | sort -u | head -10 || true)
            if [ -n "$errs" ] || [ -n "$bugs" ]; then
              echo "$net: tor errors detected"
              echo "$errs"
              echo "$bugs"
              status=1
            else
              echo "$net: no tor errors"
            fi
          done
          exit $status

      - name: Parse simulated performance
        run: |
          . toolsenv/bin/activate
          tornettools parse tornet
          tornettools parse tornet-patched
          # --tor_metrics_path takes the tor_metrics_*.json that staging
          # produces, not the tmodel directory, and --prefix is what decides
          # where the PDFs are written. Both were wrong, and the failure was
          # swallowed by "|| true", so every run reported green with nothing
          # to show for it.
          metrics=$(ls staged/tor_metrics_*.json 2>/dev/null | head -1)
          mkdir -p pdfs
          if [ -n "$metrics" ]; then
            tornettools plot tornet tornet-patched \
              --tor_metrics_path "$metrics" --prefix pdfs
          else
            echo "::warning::no staged tor_metrics json; plotting without the \
          public Tor reference lines"
            tornettools plot tornet tornet-patched --prefix pdfs
          fi

      - name: Reduce artifacts to essentials
        if: always()
        run: |
          for net in tornet tornet-patched; do
            mkdir -p "results/$net"
            cp "$net/shadow.time" "results/$net/" 2>/dev/null || true
            cp "$net/tornettools.parse.log" "results/$net/" 2>/dev/null || true
            # tornettools nests its parsed statistics, so collect them by name
            # instead of guessing the layout: "$net"/*.json matched nothing.
            find "$net" -name '*.json' -exec cp {} "results/$net/" \; \
              2>/dev/null || true
            grep -rh 'error\|panic' "$net/shadow.data/shadow.log" 2>/dev/null | \
              head -50 > "results/$net/shadow-errors.txt" || true
          done

          # The plots are the only quantified output of the whole run, and
          # "cp -r pdfs" assumed an output directory that never existed. Search
          # for them instead. This step runs with if: always(), so a missing
          # plot is a warning here -- failing hard is the plot step's job, and
          # doing it here would mask whatever actually broke.
          mkdir -p results/pdfs
          find . -name '*.pdf' -not -path './results/*' \
            -exec cp {} results/pdfs/ \; 2>/dev/null || true
          n=$(find results/pdfs -name '*.pdf' | wc -l | tr -d ' ')
          echo "collected $n plot PDFs"
          if [ "$n" -eq 0 ]; then
            echo "::warning::tornettools produced no PDFs; this run has no \
          quantified A/B comparison"
          fi

      - name: Record seed for reproducibility
        if: always()
        run: echo "$SEED" > results/seed.txt

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadow-sim-results
          path: results/
          retention-days: 14
